<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Μεζεδοπωλείο Τρύφων — Κατάλογος</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* Ίδια εμφάνιση με την οθόνη του μαγαζιού: ίδιο θέμα, ίδιο χαρτί, ίδιο σήμα.
     Αλλάζει μόνο ό,τι πρέπει να αλλάξει για κινητό — κυλάει αντί να εναλλάσσεται. */
  :root{
    --ink:#f4ece0; --bg2:#fdf8f0; --cream:#241d16; --muted:#7d6b56;
    --accent:#a8541f; --olive:#5f7040; --line:rgba(36,29,22,.16);
    --fh:'Alegreya','Noto Serif',Georgia,serif;
    --fb:'Roboto',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--ink);color:var(--cream);font-family:var(--fb);
       min-height:100%;padding-bottom:env(safe-area-inset-bottom)}

  /* Στρώσεις φόντου, ακριβώς όπως στην οθόνη */
  #bg,#scrim{position:fixed;inset:0;display:var(--bgdisp,none)}
  #bg{background-image:var(--bgimg,none);background-size:cover;background-position:center;z-index:0}
  #scrim{background:var(--ink);opacity:var(--dim,.7);z-index:1}

  .sheet{position:relative;z-index:2;max-width:680px;margin:0 auto;padding:16px 14px 40px}

  /* Η κορνίζα του μαγαζιού. Στο κινητό περιβάλλει τον κατάλογο και κυλάει μαζί του. */
  #ornaments{position:absolute;inset:14px;border:2px solid var(--accent);
    display:var(--framedisp,none);pointer-events:none}
  #ornaments span{position:absolute;width:36px;height:36px;background:var(--accent);
    -webkit-mask:url(assets/corner.svg) center/contain no-repeat;
    mask:url(assets/corner.svg) center/contain no-repeat}
  #ornaments .tl{top:-13px;left:-13px}
  #ornaments .tr{top:-13px;right:-13px;transform:scaleX(-1)}
  #ornaments .bl{bottom:-13px;left:-13px;transform:scaleY(-1)}
  #ornaments .br{bottom:-13px;right:-13px;transform:scale(-1,-1)}
  body.framed .sheet{padding:34px 34px 58px}

  header{text-align:center;padding:26px 0 16px}
  .logo{display:none;height:72px;aspect-ratio:973/651;margin:0 auto;
    background:var(--accent);
    -webkit-mask:url(assets/logo.svg) center/contain no-repeat;
    mask:url(assets/logo.svg) center/contain no-repeat}
  h1{font-family:var(--fh);font-size:34px;line-height:1.1}
  .tagline{color:var(--muted);font-size:12px;letter-spacing:.24em;
           text-transform:uppercase;margin-top:8px}
  body.haslogo h1,body.haslogo .tagline{display:none}
  body.haslogo .logo{display:block}

  nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
      padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:0 0 auto;text-decoration:none;color:var(--cream);font-size:14px;
        padding:8px 14px;border:1px solid var(--line);border-radius:99px}

  .specials{margin:24px 0 4px;padding:16px 18px;border-radius:14px;
            border:1px solid var(--line);border-left:4px solid var(--olive)}
  .specials h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;
               color:var(--olive);margin-bottom:10px}

  section{margin-top:32px;scroll-margin-top:16px}
  h2{font-family:var(--fh);font-size:26px;color:var(--accent);line-height:1.1}
  .sub{color:var(--muted);font-size:14px;font-style:italic;margin-top:3px}
  ul{list-style:none;margin-top:12px}
  li{display:grid;grid-template-columns:1fr auto;column-gap:16px;
     padding:13px 0;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:0}
  .nm{font-size:17px;font-weight:500;line-height:1.25}
  .desc{grid-column:1;color:var(--muted);font-size:14px;line-height:1.35;margin-top:3px}
  .pr{font-family:var(--fh);font-weight:700;font-size:18px;
      font-variant-numeric:tabular-nums;white-space:nowrap}
  .unit{display:block;color:var(--muted);font-size:12px;font-weight:400;
        font-family:var(--fb);text-align:right}
  .tag{display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.1em;
       text-transform:uppercase;padding:2px 8px;border-radius:99px;
       border:1px solid var(--line);color:var(--muted);vertical-align:middle}
  .tag.hot{background:var(--olive);border-color:var(--olive);color:#fff;font-weight:700}
  li.out{opacity:.42}
  li.out .nm{text-decoration:line-through}

  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
         color:var(--muted);font-size:12px;line-height:1.6;text-align:center}
  .load{text-align:center;color:var(--muted);padding:60px 0}
</style>
</head>
<body>
<div id="bg"></div><div id="scrim"></div>
<div class="sheet">
  <div id="ornaments"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
  <header>
    <div class="logo"></div>
    <h1 id="brand">Τρύφων</h1>
    <div class="tagline" id="tagline"></div>
  </header>
  <nav id="nav"></nav>
  <div id="body"><div class="load">Φόρτωση καταλόγου…</div></div>
  <footer id="note"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
function li(it){
  const tags = [];
  if (it.is_special && it.is_available) tags.push('<span class="tag hot">Σήμερα</span>');
  if (!it.is_available) tags.push('<span class="tag">Τελείωσε</span>');
  if (it.notes) tags.push('<span class="tag">'+esc(it.notes)+'</span>');
  return '<li class="'+(it.is_available?'':'out')+'">'
    + '<div class="nm">'+esc(it.name)+tags.join('')+'</div>'
    + '<div class="pr">'+money(it.price)+(it.unit?'<span class="unit">'+esc(it.unit)+'</span>':'')+'</div>'
    + (it.description ? '<div class="desc">'+esc(it.description)+'</div>' : '')
    + '</li>';
}

function render(d){
  // Ίδιο θέμα, χαρτί, σήμα και γραμματοσειρά με την οθόνη.
  // Η λιτή προβολή δεν ισχύει εδώ: στο κινητό ο χώρος είναι άπειρος, ο πελάτης κυλάει.
  applyLook(d.settings);
  document.body.classList.remove('lean');
  const framed = getComputedStyle(document.documentElement)
    .getPropertyValue('--framedisp').trim() === 'block';
  document.body.classList.toggle('framed', framed);

  document.getElementById('brand').textContent = d.settings.shop_name || 'Τρύφων';
  document.getElementById('tagline').textContent = d.settings.tagline || '';
  document.getElementById('note').textContent = d.settings.footer_note || '';
  document.getElementById('nav').innerHTML =
    d.cats.map(c => '<a href="#c'+c.id+'">'+esc(c.name)+'</a>').join('');

  const specials = d.items.filter(i => i.is_special && i.is_available);
  let html = '';
  if (specials.length){
    html += '<div class="specials"><h3>Σήμερα προτείνουμε</h3><ul>'
          + specials.map(li).join('') + '</ul></div>';
  }
  for (const c of d.cats){
    const its = d.items.filter(i => i.category_id === c.id);
    if (!its.length) continue;
    html += '<section id="c'+c.id+'"><h2>'+esc(c.name)+'</h2>'
          + (c.subtitle ? '<div class="sub">'+esc(c.subtitle)+'</div>' : '')
          + '<ul>' + its.map(li).join('') + '</ul></section>';
  }
  document.getElementById('body').innerHTML = html;
}

(async () => {
  const c = cache.load(); if (c) render(c);
  try { const d = await loadMenu(); cache.save(d); render(d); }
  catch (e){ if (!c) document.getElementById('body').innerHTML =
    '<div class="load">Δεν ήταν δυνατή η φόρτωση. Δοκιμάστε ξανά.</div>'; }
  watchMenu(async () => { try { const d = await loadMenu(); cache.save(d); render(d); } catch(e){} }, 120000);
})();
</script>
</body>
</html>
